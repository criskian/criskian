# Generates the top languages card used in README.md.
# The card is rendered inside this repository, so the profile never depends on a
# shared public instance (github-readme-stats.vercel.app is paused / rate limited).

name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide_border=true&card_width=340&exclude_repo=skills-resolve-merge-conflicts,skills-review-pull-requests,skills-introduction-to-github&theme=github_dark&bg_color=0d1117&title_color=58a6ff&custom_title=Most%20Used%20Languages
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide_border=true&card_width=340&exclude_repo=skills-resolve-merge-conflicts,skills-review-pull-requests,skills-introduction-to-github&theme=default&bg_color=ffffff&title_color=0969da&custom_title=Most%20Used%20Languages
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
